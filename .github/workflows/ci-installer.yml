name: Installer CI

on:
  push:
    paths: &installer_paths
      - 'Optimum.Bootstrap.Core/**'
      - 'Optimum.Bootstrap.Core.Tests/**'
      - 'Optimum.Cli/**'
      - 'Optimum.Cli.Tests/**'
      - 'Optimum.Installer/**'
      - 'Optimum.Installer.Tests/**'
      - 'Optimum.Installer.slnf'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'NuGet.config'
      - '.github/workflows/ci-installer.yml'
  pull_request:
    paths: *installer_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-installer-${{ hashFiles('Optimum.Bootstrap.Core/**/*.csproj', 'Optimum.Cli/**/*.csproj', 'Optimum.Installer/**/*.csproj', 'Optimum.*.Tests/**/*.csproj') }}
          restore-keys: |
            nuget-installer-

      - name: Test
        run: dotnet test Optimum.Installer.slnf -c Release --nologo

  velopack-smoke:
    name: Velopack on .NET 10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install vpk
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Pack 0.0.1, then a delta to 0.0.2
        run: |
          set -euo pipefail
          pub=$(mktemp -d)
          rel=$(mktemp -d)

          dotnet publish Optimum.Cli/Optimum.Cli.csproj -c Release -r linux-x64 \
            --self-contained -o "$pub" --nologo
          vpk '[linux]' pack -u OptimumCliSmoke -v 0.0.1 -p "$pub" -e optimum -o "$rel"

          # A no-op source change so the second pack produces a real delta.
          date > "$pub/velopack-smoke-marker.txt"
          vpk '[linux]' pack -u OptimumCliSmoke -v 0.0.2 -p "$pub" -e optimum -o "$rel"

          ls -la "$rel"
          test -f "$rel"/OptimumCliSmoke-0.0.2-linux-delta.nupkg
          test -f "$rel"/OptimumCliSmoke-0.0.2-linux-full.nupkg
          echo "Velopack 1.x packs a .NET 10 self-contained app and builds a delta."
