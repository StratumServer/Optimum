name: Platform bootstrap

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to bootstrap'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos-intel
          - macos-arm
          - linux
          - linux-arm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  bootstrap-windows:
    name: Bootstrap windows
    runs-on: windows-latest
    timeout-minutes: 45
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Read VS version
        id: vs_version
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('forks.json'))['vintageStoryVersion'])")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Resolve client archive
        id: client
        shell: bash
        run: |
          version="${{ steps.vs_version.outputs.version }}"
          name="vs_install_win-x64_${version}.exe"
          {
            echo "name=$name"
            echo "url=https://cdn.vintagestory.at/gamefiles/stable/$name"
            echo "path=.vanilla/archives/$name"
          } >> "$GITHUB_OUTPUT"

      - name: Cache client archive
        uses: actions/cache@v4
        id: cache_client
        with:
          path: .vanilla/archives
          key: vs-client-windows-${{ steps.vs_version.outputs.version }}

      - name: Download client archive
        if: steps.cache_client.outputs.cache-hit != 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p .vanilla/archives
          curl -L --fail --retry 3 --retry-delay 5 \
            -o "${{ steps.client.outputs.path }}.part" \
            "${{ steps.client.outputs.url }}"
          mv "${{ steps.client.outputs.path }}.part" "${{ steps.client.outputs.path }}"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            nuget-windows-

      - name: Bootstrap
        timeout-minutes: 20
        shell: pwsh
        run: scripts/bootstrap.ps1 -ClientArchive "${{ steps.client.outputs.path }}"

      - name: Build
        shell: bash
        run: dotnet build VintageStory.slnx -c Release --nologo

      - name: Check patches
        shell: bash
        run: bash scripts/check-patches.sh --strict-unavailable

      - name: "Package (exercises the Windows install path: package.ps1 -> prepare-runtime-donors.ps1)"
        timeout-minutes: 15
        shell: pwsh
        run: scripts/package.ps1

      - name: Run tests
        shell: bash
        run: dotnet test Optimum.Tests/Optimum.Tests.csproj -c Release --no-build --nologo

      - name: Run launcher tests
        shell: bash
        run: dotnet test Optimum.Launcher.Tests/Optimum.Launcher.Tests.csproj -c Release --no-build --nologo

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs-windows
          path: |
            .vanilla/*/vintagestory/Logs/
            .build/runtime-donors/**/*.csproj
            *.log
          retention-days: 7

  bootstrap-macos-intel:
    name: Bootstrap macos-intel
    runs-on: macos-15-intel
    timeout-minutes: 45
    if: inputs.platform == 'all' || inputs.platform == 'macos-intel'
    steps:
      - uses: actions/checkout@v4

      - name: Install bash 4+
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Set up .NET 10
