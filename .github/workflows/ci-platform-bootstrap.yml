          mv "${{ steps.client.outputs.path }}.part" "${{ steps.client.outputs.path }}"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-macos-intel-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            nuget-macos-intel-

      - name: Bootstrap
        timeout-minutes: 20
        shell: bash
        run: |
          "$(brew --prefix)/bin/bash" scripts/bootstrap.sh --client-archive "${{ steps.client.outputs.path }}"

      - name: Build
        shell: bash
        run: dotnet build VintageStory.slnx -c Release --nologo

      - name: Check patches
        shell: bash
        run: |
          "$(brew --prefix)/bin/bash" scripts/check-patches.sh --strict-unavailable

      - name: Run tests
        shell: bash
        run: dotnet test Optimum.Tests/Optimum.Tests.csproj -c Release --no-build --nologo

      - name: Run launcher tests
        shell: bash
        run: dotnet test Optimum.Launcher.Tests/Optimum.Launcher.Tests.csproj -c Release --no-build --nologo

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs-macos-intel
          path: |
            .vanilla/*/vintagestory/Logs/
            *.log
          retention-days: 7

