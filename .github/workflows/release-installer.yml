name: Release installer

# Packages the Avalonia installer for Windows, Linux (AppImage, deb, rpm), and macOS,
# publishing feeds and installer packages to GitHub releases upon a release or manual dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (defaults to the VERSION file)'
        required: false
        type: string
      publish:
        description: 'Upload the Velopack feed and installer packages to GitHub releases'
        required: true
        default: true
        type: boolean

concurrency:
  group: release-installer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `label` is only the artifact name; vpk picks the Velopack channel
          # from the RID (win / linux / osx).
          - { os: windows-latest, rid: win-x64, exe: Optimum.Installer.exe, label: win }
          - { os: ubuntu-latest, rid: linux-x64, exe: Optimum.Installer, label: linux }
          - { os: macos-15, rid: osx-arm64, exe: Optimum.Installer, label: osx-arm64 }
          - { os: macos-15, rid: osx-x64, exe: Optimum.Installer, label: osx-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ] && [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            tag_clean="${tag#installer-v}"
            tag_clean="${tag_clean#v}"
            version="$tag_clean"
          fi
          [ -n "$version" ] || version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Publish self-contained
        run: >
          dotnet publish Optimum.Installer/Optimum.Installer.csproj -c Release
          -r ${{ matrix.rid }} --self-contained
          -o publish/${{ matrix.rid }} --nologo

      - name: Pack with Velopack
        shell: bash
        run: |
          set -euo pipefail

          # Bundle the Optimum logo into every generated installer so the Setup
          # window, the AppImage/desktop entry, and the app shortcut all show the
          # Optimum icon instead of the Velopack default. Velopack wants a
          # platform-native icon: an .ico on Windows, an .icns on macOS, and a
          # .png on Linux (where --icon is required for the AppImage).
          rid="${{ matrix.rid }}"
          case "$rid" in
            win-x64) icon="Optimum.Launcher/optimum.ico" ;;
            osx-*)   icon="logo.icns" ;;
            *)       icon="Optimum.Installer/Assets/optimum-logo.png" ;;
          esac
          if [ ! -f "$icon" ]; then
            echo "icon asset not found: $icon" >&2
            exit 1
          fi

          extra_args=()
          if [ "$rid" = "win-x64" ] && [ -f Optimum.Installer/Assets/optimum-logo.png ]; then
            # Splash shown while the Windows installer runs.
            extra_args+=(--splashImage Optimum.Installer/Assets/optimum-logo.png)
          fi

          # macOS runners ship bash 3.2, where "${arr[@]}" on an empty array is an
          # unbound-variable error under set -u. Expand with the +alternate form so
          # an empty extra_args disappears instead of aborting the pack.
          dotnet vpk pack \
            --packId Optimum.Installer \
            --packTitle Optimum \
            --packVersion "${{ steps.v.outputs.version }}" \
            --packDir publish/${{ matrix.rid }} \
            --mainExe ${{ matrix.exe }} \
            --icon "$icon" \
            ${extra_args[@]+"${extra_args[@]}"} \
            --outputDir releases

      # vpk has no name-override flag. Rename the user-facing artifacts (setup,
      # portable, AppImage, pkg) to Optimum-v<version>-<rid>-Installer.<ext> and fix
      # the reference in assets.<channel>.json so `vpk upload` still finds them.
      - name: Rename artifacts to the Optimum scheme
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          rid="${{ matrix.rid }}"
          case "$rid" in
            win-x64)   channel=win ;;
            linux-x64) channel=linux ;;
            osx-*)     channel=osx ;;
            *) echo "unknown rid: $rid" >&2; exit 1 ;;
          esac
          cd releases
          assets="assets.$channel.json"

          rename() {
            local old="$1" new="$2" tmp
            [ -f "$old" ] || { echo "skip (absent): $old"; return 0; }
            mv "$old" "$new"
            if [ -f "$assets" ]; then
              tmp="$(mktemp)"
              jq --arg o "$old" --arg n "$new" \
                'map(if .RelativeFileName == $o then .RelativeFileName = $n else . end)' \
                "$assets" > "$tmp"
              mv "$tmp" "$assets"
            fi
            echo "renamed: $old -> $new"
          }

          case "$channel" in
            win)
              rename "Optimum.Installer-win-Setup.exe"     "Optimum-v$v-$rid-Setup.exe"
              rename "Optimum.Installer-win-Portable.zip" "Optimum-v$v-$rid-Installer-Portable.zip"
              ;;
            linux)
              rename "Optimum.Installer.AppImage"        "Optimum-v$v-$rid-Installer.AppImage"
              ;;
            osx)
              rename "Optimum.Installer-osx-Setup.pkg"   "Optimum-v$v-$rid-Installer.pkg"
              rename "Optimum.Installer-osx-Portable.zip" "Optimum-v$v-$rid-Installer-Portable.zip"
              ;;
          esac

          echo "--- releases/ ---"; ls -la
          [ -f "$assets" ] && { echo "--- $assets ---"; cat "$assets"; } || true

      - name: Package deb and rpm (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"

          # 1. Build .deb
          deb_stage="deb-pkg"
          mkdir -p "$deb_stage/DEBIAN"
          mkdir -p "$deb_stage/usr/bin"
          mkdir -p "$deb_stage/usr/lib/optimum-installer"
          mkdir -p "$deb_stage/usr/share/applications"
          mkdir -p "$deb_stage/usr/share/icons/hicolor/256x256/apps"

          cp -r publish/linux-x64/* "$deb_stage/usr/lib/optimum-installer/"
          chmod +x "$deb_stage/usr/lib/optimum-installer/Optimum.Installer"
          ln -sf /usr/lib/optimum-installer/Optimum.Installer "$deb_stage/usr/bin/optimum-installer"

          printf '[Desktop Entry]\nType=Application\nName=Optimum Installer\nComment=Installer and setup tool for Optimum client\nExec=optimum-installer\nIcon=optimum-installer\nTerminal=false\nCategories=Game;Utility;\n' > "$deb_stage/usr/share/applications/optimum-installer.desktop"

          if [ -f Optimum.Installer/Assets/optimum-logo.png ]; then
            cp Optimum.Installer/Assets/optimum-logo.png "$deb_stage/usr/share/icons/hicolor/256x256/apps/optimum-installer.png"
          fi

          printf 'Package: optimum-installer\nVersion: %s\nSection: games\nPriority: optional\nArchitecture: amd64\nMaintainer: StratumServer <support@stratumserver.com>\nDescription: High-performance client installer for Vintage Story\n Optimum is an optimized, high-performance client fork for Vintage Story.\n' "$v" > "$deb_stage/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$deb_stage" "releases/Optimum-v$v-linux-x64-Installer.deb"
          rm -rf "$deb_stage"
          echo "Created deb package: releases/Optimum-v$v-linux-x64-Installer.deb"

          # 2. Build .rpm
          sudo apt-get update -y && sudo apt-get install -y rpm
          rpm_root="$HOME/rpmbuild"
          mkdir -p "$rpm_root"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          rpm_ver="${v//-/_}"

          {
            echo "Name:           optimum-installer"
            echo "Version:        $rpm_ver"
            echo "Release:        1%{?dist}"
            echo "Summary:        High-performance client installer for Vintage Story"
            echo "License:        MIT"
            echo "AutoReqProv:    no"
            echo ""
            echo "%description"
            echo "Optimum is an optimized, high-performance client fork for Vintage Story."
            echo ""
            echo "%install"
            echo "mkdir -p %{buildroot}/usr/bin"
            echo "mkdir -p %{buildroot}/usr/lib/optimum-installer"
            echo "mkdir -p %{buildroot}/usr/share/applications"
            echo "mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps"
            echo "cp -r \$GITHUB_WORKSPACE/publish/linux-x64/* %{buildroot}/usr/lib/optimum-installer/"
            echo "chmod +x %{buildroot}/usr/lib/optimum-installer/Optimum.Installer"
            echo "ln -sf /usr/lib/optimum-installer/Optimum.Installer %{buildroot}/usr/bin/optimum-installer"
            echo "printf '[Desktop Entry]\\\nType=Application\\\nName=Optimum Installer\\\nComment=Installer and setup tool for Optimum client\\\nExec=optimum-installer\\\nIcon=optimum-installer\\\nTerminal=false\\\nCategories=Game;Utility;\\\n' > %{buildroot}/usr/share/applications/optimum-installer.desktop"
            echo "if [ -f \$GITHUB_WORKSPACE/Optimum.Installer/Assets/optimum-logo.png ]; then"
            echo "  cp \$GITHUB_WORKSPACE/Optimum.Installer/Assets/optimum-logo.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/optimum-installer.png"
            echo "fi"
            echo ""
            echo "%files"
            echo "/usr/bin/optimum-installer"
            echo "/usr/lib/optimum-installer"
            echo "/usr/share/applications/optimum-installer.desktop"
            echo "%ghost /usr/share/icons/hicolor/256x256/apps/optimum-installer.png"
          } > "$rpm_root/SPECS/optimum-installer.spec"

          rpmbuild -bb --define "_topdir $rpm_root" "$rpm_root/SPECS/optimum-installer.spec"
          find "$rpm_root/RPMS" -name "*.rpm" -exec cp {} "releases/Optimum-v$v-linux-x64-Installer.rpm" \;
          rm -rf "$rpm_root"
          echo "Created rpm package: releases/Optimum-v$v-linux-x64-Installer.rpm"

      - name: Sign (Windows)
        if: matrix.rid == 'win-x64' && env.WINDOWS_CERT_BASE64 != ''
        run: echo "signtool step goes here once a certificate secret exists"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.label }}
          path: releases/
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'release' || inputs.publish }}
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Resolve version and tag
        id: v
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ] && [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            tag_clean="${tag#installer-v}"
            tag_clean="${tag_clean#v}"
            version="$tag_clean"
          else
            version="${version:-$(cat VERSION)}"
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download the feeds
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: feeds

      - name: Publish Velopack feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.v.outputs.version }}"
          tag="${{ steps.v.outputs.tag }}"
          for channel in win linux; do
            if [ -d "feeds/installer-$channel" ]; then
              dotnet vpk upload github \
                --repoUrl "https://github.com/${{ github.repository }}" \
                --token "$GITHUB_TOKEN" \
                --outputDir "feeds/installer-$channel" \
                --channel "$channel" \
                --tag "$tag" \
                --releaseName "$tag" \
                --merge \
                --publish
            fi
          done

      - name: Upload all installer packages to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          mapfile -t files < <(find feeds -type f \( -name "Optimum-*" \) | sort -u)
          if [ ${#files[@]} -gt 0 ]; then
            echo "Uploading installer packages to release $tag:"
            printf '%s\n' "${files[@]}"
            gh release upload "$tag" "${files[@]}" --clobber --repo "${{ github.repository }}"
          fi

  checksums:
    name: Checksums and VirusTotal reports
    if: ${{ github.event_name == 'release' || inputs.publish }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pass the tag via the environment to prevent shell injection.
      - name: Publish SHA-256 checksums and VirusTotal reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: node scripts/release-checksums.js "$RELEASE_TAG"
