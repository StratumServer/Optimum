name: Release installer

# Packages the Avalonia installer with Velopack for Windows and Linux and
# publishes the feed. macOS binaries are built for archival but not published:
# there is no Apple Developer Program account yet (INSTALLER-PLAN.md section 2).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (defaults to the VERSION file)'
        required: false
        type: string
      publish:
        description: 'Upload the Velopack feed to GitHub releases'
        required: true
        default: false
        type: boolean

concurrency:
  group: release-installer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, exe: Optimum.Installer.exe, channel: win }
          - { os: ubuntu-latest, rid: linux-x64, exe: Optimum.Installer, channel: linux }
          - { os: macos-14, rid: osx-arm64, exe: Optimum.Installer, channel: osx, archive_only: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: v
        shell: bash
        run: printf 'version=%s\n' "${{ inputs.version || '' }}" > /dev/null; echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Publish self-contained
        run: >
          dotnet publish Optimum.Installer/Optimum.Installer.csproj -c Release
          -r ${{ matrix.rid }} --self-contained
          -o publish/${{ matrix.rid }} --nologo

      - name: Pack with Velopack
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.v.outputs.version }}"
          [ -n "$version" ] || version="$(cat VERSION)"
          dotnet vpk pack \
            --packId Optimum.Installer \
            --packVersion "$version" \
            --packDir publish/${{ matrix.rid }} \
            --mainExe ${{ matrix.exe }} \
            --channel ${{ matrix.channel }} \
            --outputDir releases

      - name: Sign (Windows)
        if: matrix.rid == 'win-x64' && env.WINDOWS_CERT_BASE64 != ''
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: echo "signing wired to secrets; no cert configured yet, artifact is unsigned"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.rid }}
          path: releases/
          retention-days: 14

      - name: Publish to GitHub releases
        if: ${{ inputs.publish && !matrix.archive_only }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ steps.v.outputs.version }}"
          [ -n "$version" ] || version="$(cat VERSION)"
          dotnet vpk upload github \
            --repoUrl https://github.com/${{ github.repository }} \
            --channel ${{ matrix.channel }} \
            --tag installer-v"$version" \
            --releaseName "Optimum installer v$version" \
            --publish
