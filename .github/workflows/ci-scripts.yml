name: Shell scripts

on:
  push:
    paths: &script_paths
      - 'scripts/**'
      - 'patches/**'
      - 'sources/shaders/**'
      - 'Makefile'
      - '.github/workflows/ci-scripts.yml'
  pull_request:
    paths: *script_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-repository:
    name: Clone helpers survive a hostile Git environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: bootstrap-git-test
        run: make bootstrap-git-test

  installer-staging:
    name: Linux installer stages without a throwaway archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: install-linux-staging test
        run: bash scripts/tests/install-linux-staging.sh

  assemblyinfo-fixup:
    name: AssemblyInfo Guid and ComVisible attributes resolve cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: AssemblyInfo fixup test
        run: bash scripts/tests/bootstrap-assemblyinfo-fixup.sh

  donor-dotnet-selection:
    name: Runtime donor dotnet candidate resolution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Runtime donor candidate resolution test
        run: bash scripts/tests/runtime-donor-dotnet-selection.sh

      - name: Runtime donor API compatibility test
        run: bash scripts/tests/runtime-donor-api-compatibility.sh

  windows-runtimeconfig:
    name: Windows PowerShell 5.1 runtimeconfig merge
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Run runtimeconfig sync under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/tests/sync-runtimeconfig-frameworks.ps1

  windows-extract-stage:
    name: Windows extraction staging in PowerShell 5.1 and 7
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Run extraction staging test under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/tests/extract-stage-root.ps1

      - name: Run extraction staging test under PowerShell 7
        shell: pwsh
        run: ./scripts/tests/extract-stage-root.ps1

  release-checksums:
    name: Release checksums and VirusTotal formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release checksums unit tests
        run: bash scripts/tests/release-checksums.sh

  patch-syntax:
    name: Patch syntax and headers validate cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Validate patch syntax
        run: bash scripts/validate-patch-syntax.sh patches

  shader-assets:
    name: Shader asset overlays are intact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Validate shader assets
        run: bash scripts/validate-shader-assets.sh sources/shaders

  installer-prerequisites:
    name: Linux installer prerequisite resolution and non-FHS routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Run Linux NixOS and non-FHS prerequisite tests
        run: bash scripts/tests/install-linux-nixos.sh

      - name: Run Linux installer prerequisite detection and installation tests
        run: bash scripts/tests/install-linux-prerequisites.sh

  worldgen-benchmark-fixtures:
    name: Worldgen benchmark fixtures and statistics integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Run worldgen benchmark integrity tests
        run: bash scripts/tests/worldgen-benchmark-integrity-test.sh
